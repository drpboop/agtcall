<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>regular agent call note</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Century+Gothic&display=swap');

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Century Gothic', sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: #111;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
      width: 90%;
      max-width: 500px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    label,
    input,
    select,
    textarea {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      background-color: #222;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 5px;
      font-family: 'Century Gothic', sans-serif;
      box-sizing: border-box;
    }

    label {
      background: none;
      padding: 0;
    }

    textarea {
      min-height: 60px;
      resize: vertical;
      line-height: 1.4;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      background-color: #444;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'Century Gothic', sans-serif;
    }

    button:hover {
      background-color: #666;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.8);
    }

    .modal-content {
      background-color: #111;
      margin: 15% auto;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .close {
      float: right;
      font-size: 28px;
      cursor: pointer;
      color: #aaa;
    }

    .close:hover {
      color: #fff;
    }

    textarea#output {
      height: 180px;
      resize: none;
      background-color: #222;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
<div class="container">

  <label for="callerName">caller name:</label>
  <input type="text" id="callerName">

  <label for="xferFlag">xfer:</label>
  <select id="xferFlag" onchange="toggleXferFields()">
    <option value="no">no</option>
    <option value="yes">yes</option>
  </select>

  <div id="xferSection" style="display:none;">
    <label for="xferFrom">xfer from:</label>
    <select id="xferFrom">
      <option value="">-- select an option --</option>
      <option value="internal agt">internal agt</option>
      <option value="plan">plan</option>
      <option value="supervisor">supervisor</option>
      <option value="other">other</option>
    </select>

    <label for="xferedCaller">xfered caller name:</label>
    <input type="text" id="xferedCaller">
  </div>

  <label for="type">caller type:</label>
  <select id="type">
    <option value="">-- select an option --</option>
    <option value="alexa (ai)">alexa (ai)</option>
    <option value="cms test caller">cms test caller</option>
    <option value="member">member</option>
    <option value="parent of minor">parent</option>
    <option value="pharmacy">pharmacy</option>
    <option value="plan">plan</option>
    <option value="provider">provider</option>
    <option value="spouse">spouse</option>
    <option value="third party">third party</option>
  </select>

  <label for="reason">reason for call:</label>
  <input type="text" id="reason">

  <label for="rx">rx:</label>
  <input type="text" id="rx">

  <label for="resolution">res:</label>
  <select id="resolution">
    <option value="">-- select an option --</option>
    <option>check/apply override per psa j/a</option>
    <option>check eligibility</option>
    <option>check pharm network</option>
    <option>check quantity limits</option>
    <option>confirm coverage</option>
    <option>create pr case per j/a</option>
    <option>escalation/xfer caller</option>
    <option>explore alternative medication options</option>
    <option>inform of formulary exception/coverage exception</option>
    <option>initiate/fax forms for prior authorization</option>
    <option>review prior authorization status</option>
    <option>reach out to clinical regarding prior authorization</option>
    <option>review accumulators</option>
    <option>review/resolve claim reject</option>
    <option>verify costshare details via benefits</option>
  </select>

  <textarea id="notes" placeholder="additional notes"></textarea>

  <div class="button-row">
    <button onclick="generateNote()">submit</button>
    <button onclick="clearForm()">cancel</button>
  </div>
</div>

<div id="noteModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <textarea id="output" readonly></textarea>
    <div class="button-row">
      <button onclick="copyNote()">copy</button>
      <button onclick="location.reload()">reset</button>
    </div>
  </div>
</div>

<script>
  function toggleXferFields() {
    const show = xferFlag.value === 'yes';
    document.getElementById('xferSection').style.display = show ? 'block' : 'none';

    if (!show) {
      xferFrom.value = '';
      xferedCaller.value = '';
    }
  }

  function generateNote() {
    const lines = [];

    if (callerName.value.trim())
      lines.push(`caller name: ${callerName.value.trim()}`);

    if (xferFlag.value === 'yes' && xferFrom.value)
      lines.push(`xfer from: ${xferFrom.value}`);

    if (xferFlag.value === 'yes' && xferedCaller.value.trim())
      lines.push(`xfered caller name: ${xferedCaller.value.trim()}`);

    if (type.value)
      lines.push(`caller type: ${type.value}`);

    if (reason.value.trim())
      lines.push(`reason for call: ${reason.value.trim()}`);

    if (rx.value.trim())
      lines.push(`rx: ${rx.value.trim()}`);

    if (resolution.value) {
      let resLine = `res: ${resolution.value}`;
      if (notes.value.trim()) resLine += ` / ${notes.value.trim()}`;
      lines.push(resLine);
    }

    output.value = lines.join(' //\n');
    noteModal.style.display = 'block';
  }

  function copyNote() {
    output.select();
    document.execCommand('copy');
  }

  function clearForm() {
    document.querySelectorAll('input, textarea').forEach(el => el.value = '');
    document.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
    document.getElementById('xferSection').style.display = 'none';
    xferFlag.value = 'no';
  }

  function closeModal() {
    noteModal.style.display = 'none';
  }
</script>

</body>
</html>
